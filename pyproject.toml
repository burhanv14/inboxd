[project]
name = "leadfinder"
version = "0.1.0"
description = "Async agent for recruiter/lead discovery (Google Custom Search)"
requires-python = ">=3.11"
authors = [{ name = "inboxd" }]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.4.0",
    "aiolimiter>=0.4.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "idna>=3.7",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.19.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["leadfinder*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
lint.select = ["E", "F", "I", "N", "Q", "RUF", "S", "B", "C4", "UP", "PL", "DTZ"]
lint.ignore = ["B008", "B018", "S101", "S311", "E501"]
format.quote-style = "double"
format.skip-magic-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "use asyncio.sleep instead"
"requests.get".msg = "use httpx.AsyncClient instead"
"requests.post".msg = "use httpx.AsyncClient instead"
"urllib.request.urlopen".msg = "use httpx instead"
"urllib3.PoolManager".msg = "use httpx instead"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
known-first-party = ["leadfinder"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: opt-in live smoke test (skipped by default)",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
